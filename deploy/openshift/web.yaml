# MaintenanceHub web (nginx static, non-root UID 10001, port 8080)
apiVersion: v1
kind: Service
metadata:
  name: maintenancehub-web
  labels:
    app: maintenancehub-web
spec:
  selector:
    app: maintenancehub-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenancehub-web
  labels:
    app: maintenancehub-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maintenancehub-web
  template:
    metadata:
      labels:
        app: maintenancehub-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: image-registry.openshift-image-registry.svc:5000/maintenancehub/web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "200m"
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          env:
            # nginx proxies /api to this service DNS name inside the project
            - name: API_UPSTREAM
              value: http://maintenancehub-api:8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maintenancehub-web
spec:
  to:
    kind: Service
    name: maintenancehub-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
