# Minimal placeholder — flesh out in M13
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenancehub-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maintenancehub-api
  template:
    metadata:
      labels:
        app: maintenancehub-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: maintenancehub-api:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
          envFrom:
            - secretRef:
                name: maintenancehub-secrets
