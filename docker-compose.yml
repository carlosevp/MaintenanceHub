# Integrated local stack: web + api + worker + PostgreSQL
# Lightweight non-Compose dev remains available via Makefile (SQLite).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mh
      POSTGRES_PASSWORD: mh
      POSTGRES_DB: maintenancehub
    ports:
      - "5432:5432"
    volumes:
      - mh-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mh -d maintenancehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mh:mh@postgres:5432/maintenancehub
      ENVIRONMENT: development
      AUTH_MODE: local_dev
      JWT_SECRET: local-compose-secret-not-for-prod
    command: ["alembic", "-c", "db/alembic.ini", "upgrade", "head"]
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      AUTH_MODE: local_dev
      DATABASE_URL: postgresql+psycopg://mh:mh@postgres:5432/maintenancehub
      JWT_SECRET: local-compose-secret-not-for-prod
      SEED_DEMO_DATA: "true"
      API_CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
      PUBLIC_BASE_URL: http://localhost:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mh:mh@postgres:5432/maintenancehub
      WORKER_POLL_SECONDS: "5"
      JWT_SECRET: local-compose-secret-not-for-prod
      ENVIRONMENT: development
      AUTH_MODE: local_dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      API_UPSTREAM: http://api:8000
    depends_on:
      - api

volumes:
  mh-pg:
