<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MaintenanceHub banner example</title>
    <link rel="stylesheet" href="../src/style.css" />
  </head>
  <body>
    <h1>Host application</h1>
    <p>The banner below loads confirmed maintenance/outage notices only.</p>
    <div id="mh-banner-root"></div>
    <script src="../src/embed.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var params = new URLSearchParams(location.search);
        // No accessToken needed for public DTO — never put client_secret in HTML.
        window.MaintenanceHubBanner.mount({
          target: "#mh-banner-root",
          apiBaseUrl: params.get("api") || "http://localhost:8000",
          applicationKey: params.get("app") || "claims",
          environmentKey: params.get("env") || "INT",
          theme: params.get("theme") || "light",
          advanceHours: Number(params.get("advance") || 24),
          pollIntervalMs: 60_000,
        });
      });
    </script>
  </body>
</html>
