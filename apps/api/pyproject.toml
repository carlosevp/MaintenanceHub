[project]
name = "maintenancehub-api"
version = "0.1.0"
description = "MaintenanceHub FastAPI service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",
  "python-multipart>=0.0.12",
  "email-validator>=2.2.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Correctness-focused set so `make lint` fails on real issues without
# requiring a wholesale style rewrite of the existing codebase.
[tool.ruff.lint]
select = [
  "E9",   # runtime syntax
  "F63",  # invalid print/assertions
  "F7",   # syntax errors
  "F82",  # undefined names
  "F401", # unused imports
  "F841", # unused variables
]
